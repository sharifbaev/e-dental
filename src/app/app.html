<div class="p-4">
  <h1 class="text-3xl font-bold text-blue-600 mb-4">{{ 'app.title' | transloco }}</h1>

  <div class="flex gap-2 mb-4">
    <button
      class="px-3 py-1 rounded border"
      [class.bg-blue-600]="lang() === 'ru'"
      [class.text-white]="lang() === 'ru'"
      (click)="setLang('ru')">
      RU
    </button>
    <button
      class="px-3 py-1 rounded border"
      [class.bg-blue-600]="lang() === 'uz'"
      [class.text-white]="lang() === 'uz'"
      (click)="setLang('uz')">
      UZ
    </button>
  </div>

  <ul class="space-y-1">
    <li>{{ 'menu.dashboard' | transloco }}</li>
    <li>{{ 'menu.schedule' | transloco }}</li>
    <li>{{ 'menu.patients' | transloco }}</li>
    <li>{{ 'menu.doctors' | transloco }}</li>
    <li>{{ 'menu.settings' | transloco }}</li>
  </ul>
</div>

<router-outlet />й
