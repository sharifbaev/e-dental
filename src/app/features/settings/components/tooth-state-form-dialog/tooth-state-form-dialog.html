<!-- Шапка -->
<div class="flex items-center justify-between gap-2 px-6 pt-5 pb-2">
  <h2 class="font-display text-lg font-bold text-content">{{ (isEdit ? 'settings.dictionaries.editTitle' : 'settings.dictionaries.addTitle') | transloco }}</h2>
  <button matIconButton mat-dialog-close type="button" [title]="'common.close' | transloco">
    <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pb-2" (ngSubmit)="save()">
    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-soft">{{ 'settings.dictionaries.name' | transloco }} <span class="text-red-500">*</span></span>
      <input type="text" formControlName="name" autocomplete="off" class="w-full h-11 px-3 rounded-xl bg-field border text-sm text-content outline-none focus:border-brand-300 focus:bg-surface" [class.border-transparent]="!isInvalid()" [class.border-red-300]="isInvalid()">
      @if (isInvalid()) {
        <span class="text-xs text-red-600">{{ 'settings.dictionaries.nameError' | transloco }}</span>
      }
    </label>

    <!-- Цвет: квадратики палитры -->
    <div class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-soft">{{ 'settings.dictionaries.color' | transloco }}</span>
      <div class="flex flex-wrap gap-2" role="radiogroup" [attr.aria-label]="'settings.dictionaries.color' | transloco">
        @for (item of colors; track item.color) {
          <button type="button" role="radio" class="w-9 h-9 rounded-lg border-2" [class]="item.classes" [class.ring-2]="colorValue() === item.color" [class.ring-brand-600]="colorValue() === item.color" [class.ring-offset-2]="colorValue() === item.color" [attr.aria-checked]="colorValue() === item.color" [attr.aria-label]="item.color" (click)="setColor(item.color)"></button>
        }
      </div>
    </div>

    <!-- Как будет выглядеть в зубной формуле -->
    <div class="flex items-center gap-3 p-3 rounded-xl bg-page">
      <span class="w-11 h-11 shrink-0 rounded-lg border text-xs font-semibold flex items-center justify-center" [class]="previewClasses(colorValue())">16</span>
      <span class="px-3 py-1.5 rounded-full border text-sm font-medium truncate" [class]="previewClasses(colorValue())">{{ nameValue() || ('settings.dictionaries.name' | transloco) }}</span>
    </div>
  </form>
</mat-dialog-content>

<div class="px-6 py-4 flex flex-col-reverse sm:flex-row gap-2">
  <button type="button" mat-dialog-close class="flex-1 px-4 py-3 rounded-xl border border-line-strong text-sm font-medium text-soft hover:bg-page">{{ 'common.cancel' | transloco }}</button>
  <button type="button" class="flex-1 px-4 py-3 rounded-xl bg-brand-700 text-sm font-semibold text-white hover:bg-brand-800" (click)="save()">{{ (isEdit ? 'finance.saveChanges' : 'finance.add') | transloco }}</button>
</div>
