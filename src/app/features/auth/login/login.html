<div class="w-80 max-w-sm flex flex-col mt-64 md:w-full md:max-w-md lg:max-w-lg md:mt-0 md:mr-auto md:ml-16 lg:ml-32 md:rounded-xl md:p-10 lg:p-12">
  <div class="hidden md:flex flex-col items-center mb-6 md:mb-8">
    <img src="favicon.svg" alt="" class="w-12 h-12 mb-2 lg:w-14 lg:h-14 brightness-0 invert">
    <h1 class="text-2xl lg:text-3xl font-bold text-white">{{ 'app.title' | transloco }}</h1>
    <p class="text-gray-500 text-sm">{{ 'login.subtitle' | transloco }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full flex flex-col md:gap-2">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'login.username' | transloco }}</mat-label>
      <input matInput formControlName="username" autocomplete="username">
      <mat-error>{{ 'login.errors.required' | transloco }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'login.password' | transloco }}</mat-label>
      <input
        matInput
        formControlName="password"
        autocomplete="current-password"
        [type]="hidePassword() ? 'password' : 'text'">
      <button matIconButton matSuffix type="button" (click)="togglePassword()">
        <mat-icon fontSet="material-symbols-outlined">
          {{ hidePassword() ? 'visibility' : 'visibility_off' }}
        </mat-icon>
      </button>
      <mat-error>{{ 'login.errors.required' | transloco }}</mat-error>
    </mat-form-field>

    @if (invalidCredentials()) {
      <div class="text-red-600 text-sm mb-3">{{ 'login.errors.invalid' | transloco }}</div>
    }

    <button matButton="filled" type="submit" class="h-11 md:h-12 md:mt-2" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ 'login.submit' | transloco }}
      }
    </button>
  </form>
</div>
