<!-- Шапка -->
<div class="flex items-center justify-between gap-2 px-6 pt-5 pb-2">
  <h2 class="font-display text-lg font-bold text-content">{{ (isEdit ? 'finance.debts.editTitle' : 'finance.debts.addTitle') | transloco }}</h2>
  <button matIconButton mat-dialog-close type="button" [title]="'common.close' | transloco">
    <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pb-2" (ngSubmit)="save()">
    <!-- Кто кому должен -->
    <div class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-page" role="radiogroup">
      @for (direction of directions; track direction) {
        <button type="button" role="radio" [attr.aria-checked]="form.controls.direction.value === direction" class="h-10 rounded-lg text-sm font-medium transition-colors" [class.bg-surface]="form.controls.direction.value === direction" [class.shadow-sm]="form.controls.direction.value === direction" [class.text-brand-700]="form.controls.direction.value === direction" [class.text-muted]="form.controls.direction.value !== direction" (click)="form.controls.direction.setValue(direction)">{{ ('finance.directions.' + direction) | transloco }}</button>
      }
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-xs font-medium text-soft">{{ 'finance.fields.counterparty' | transloco }} <span class="text-red-500">*</span></span>
        <input type="text" formControlName="counterparty" autocomplete="off" class="w-full h-11 px-3 rounded-xl bg-page border text-sm text-content outline-none focus:border-brand-300 focus:bg-surface" [class.border-transparent]="!isInvalid('counterparty')" [class.border-red-300]="isInvalid('counterparty')">
        @if (isInvalid('counterparty')) {
          <span class="text-xs text-red-600">{{ 'appointmentForm.errors.minLength' | transloco }}</span>
        }
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-xs font-medium text-soft">{{ 'finance.fields.phone' | transloco }}</span>
        <input type="tel" formControlName="phone" autocomplete="off" placeholder="+998 90 123-45-67" class="w-full h-11 px-3 rounded-xl bg-page border border-transparent text-sm text-content placeholder:text-subtle outline-none focus:border-brand-300 focus:bg-surface">
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-xs font-medium text-soft">{{ 'finance.fields.date' | transloco }} <span class="text-red-500">*</span></span>
        <input type="date" formControlName="date" class="w-full h-11 px-3 rounded-xl bg-page border text-sm text-content outline-none focus:border-brand-300 focus:bg-surface" [class.border-transparent]="!isInvalid('date')" [class.border-red-300]="isInvalid('date')">
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-xs font-medium text-soft">{{ 'finance.fields.dueDate' | transloco }}</span>
        <input type="date" formControlName="dueDate" class="w-full h-11 px-3 rounded-xl bg-page border border-transparent text-sm text-content outline-none focus:border-brand-300 focus:bg-surface">
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="text-xs font-medium text-soft">{{ 'finance.fields.debtAmount' | transloco }} <span class="text-red-500">*</span></span>
        <input type="number" min="0" step="1000" formControlName="amount" class="w-full h-11 px-3 rounded-xl bg-page border text-sm text-content outline-none focus:border-brand-300 focus:bg-surface" [class.border-transparent]="!isInvalid('amount')" [class.border-red-300]="isInvalid('amount')">
        @if (isInvalid('amount')) {
          <span class="text-xs text-red-600">{{ 'finance.errors.amount' | transloco }}</span>
        }
      </label>
      <label class="flex flex-col gap-1 min-w-0">
        <span class="flex items-center justify-between text-xs font-medium text-soft">
          {{ 'finance.fields.paid' | transloco }}
          <button type="button" class="text-xs font-semibold text-accent hover:underline" (click)="payInFull()">{{ 'finance.debts.payInFull' | transloco }}</button>
        </span>
        <input type="number" min="0" step="1000" formControlName="paid" class="w-full h-11 px-3 rounded-xl bg-page border text-sm text-content outline-none focus:border-brand-300 focus:bg-surface" [class.border-transparent]="!paidTooMuch" [class.border-red-300]="paidTooMuch">
        @if (paidTooMuch) {
          <span class="text-xs text-red-600">{{ 'finance.errors.paidTooMuch' | transloco }}</span>
        }
      </label>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-soft">{{ 'finance.fields.note' | transloco }}</span>
      <textarea rows="2" formControlName="note" class="w-full px-3 py-2.5 rounded-xl bg-page border border-transparent text-sm text-content outline-none resize-none focus:border-brand-300 focus:bg-surface"></textarea>
    </label>
  </form>
</mat-dialog-content>

<div class="px-6 py-4 flex flex-col-reverse sm:flex-row gap-2">
  <button type="button" mat-dialog-close class="flex-1 px-4 py-3 rounded-xl border border-line-strong text-sm font-medium text-soft hover:bg-page">{{ 'common.cancel' | transloco }}</button>
  <button type="button" class="flex-1 px-4 py-3 rounded-xl bg-brand-700 text-sm font-semibold text-white hover:bg-brand-800" (click)="save()">{{ (isEdit ? 'finance.saveChanges' : 'finance.add') | transloco }}</button>
</div>
