<div class="p-6 flex flex-col items-center gap-3 text-center">
  <span class="w-14 h-14 rounded-full flex items-center justify-center" [class.bg-emerald-50]="isSuccess" [class.text-emerald-600]="isSuccess" [class.bg-red-50]="!isSuccess" [class.text-red-600]="!isSuccess">
    <mat-icon fontSet="material-symbols-outlined" style="font-size: 32px; width: 32px; height: 32px;">{{ isSuccess ? 'check_circle' : 'error' }}</mat-icon>
  </span>

  <div>
    <h2 class="font-display text-lg font-bold text-content">{{ data.titleKey | transloco }}</h2>
    @if (data.messageKey) {
      <p class="mt-1 text-sm text-soft">{{ data.messageKey | transloco: data.messageParams }}</p>
    }
  </div>

  <button type="button" class="mt-1 w-full px-4 py-3 rounded-lg text-sm font-medium" [class.bg-brand-700]="isSuccess" [class.text-white]="isSuccess" [class.hover:bg-brand-800]="isSuccess" [class.border]="!isSuccess" [class.border-line-strong]="!isSuccess" [class.text-soft]="!isSuccess" [class.hover:bg-page]="!isSuccess" mat-dialog-close>{{ 'feedback.ok' | transloco }}</button>
</div>
