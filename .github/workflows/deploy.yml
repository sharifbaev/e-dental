name: Build and deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag sha-<full commit hash>: exactly what the dispatch below sends to dental-ms
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the dental server
        env:
          GH_TOKEN: ${{ secrets.DENTAL_MS_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/izzatmadaminov/dental-ms/actions/workflows/deploy-web.yml/dispatches \
            -f ref=main -f "inputs[tag]=sha-${GITHUB_SHA}"
